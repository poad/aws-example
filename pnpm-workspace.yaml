packages:
  - ./**
  - '!**/.next'
  - '!**/cdk.out'
  - '!**/cdk.out/**'
  - '!**/dist'
  - '!**/build'

allowBuilds:
  '@apollo/protobufjs': false
  esbuild: false
  protobufjs: false
  sharp: false
  tldjs: false
  unrs-resolver: false

enablePrePostScripts: false

engineStrict: true

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@11.19.0
  - '@modelcontextprotocol/codemod@2.0.0'
  - '@modelcontextprotocol/client@2.0.0'
  - '@modelcontextprotocol/core@2.0.0'
  - '@modelcontextprotocol/hono@2.0.0'
  - '@modelcontextprotocol/server@2.0.0'
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - '@opentelemetry/auto-instrumentations-node@0.75.0'
  - '@opentelemetry/sdk-node@0.217.0'
  - '@opentelemetry/exporter-prometheus@0.217.0'
  - '@opentelemetry/core@2.8.0'
  - '@hono/node-server@2.0.5'
  - '@opentelemetry/propagator-jaeger@2.9.0'
  - sharp@0.35.0
  - brace-expansion@1.1.17 || 2.1.3
  - protobufjs@8.0.2 || 8.2.0 || 8.4.1 || 8.5.1 || 8.6.6

overrides:
  '@hono/node-server@<2.0.5': ^2.0.5
  '@opentelemetry/auto-instrumentations-node@<0.75.0': ^0.75.0
  '@opentelemetry/core@<2.8.0': ^2.8.0
  '@opentelemetry/exporter-prometheus@<0.217.0': ^0.217.0
  '@opentelemetry/propagator-jaeger@<2.9.0': ^2.9.0
  '@opentelemetry/sdk-node@<0.217.0': ^0.217.0
  brace-expansion@<1.1.17: ^1.1.17
  brace-expansion@>=2.0.0 <2.1.3: ^2.1.3
  eslint-import-resolver-typescript: '^4.4.4'
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  protobufjs@>=8.0.0 <8.2.0: ^8.2.0
  protobufjs@>=8.0.0 <=8.0.1: ^8.0.2
  protobufjs@>=8.0.0 <=8.4.0: ^8.4.1
  protobufjs@>=8.0.0 <=8.5.0: ^8.5.1
  protobufjs@>=8.0.0 <=8.6.5: ^8.6.6
  semver: '>=7'
  sharp@<0.35.0: ^0.35.0
  uuid: '>=14.0.0'

strictPeerDependencies: false

trustPolicy: no-downgrade
