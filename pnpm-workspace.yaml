  - '@oxfmt/binding-win32-ia32-msvc@0.67.0'
  - '@oxfmt/binding-win32-x64-msvc@0.67.0'
  - '@oxlint/binding-android-arm-eabi@1.82.0'
  - '@oxlint/binding-android-arm64@1.82.0'
