packages:
  - bedrock/agentcore-runtime-agent-example
  - bedrock/agentcore-runtime-agent-example/app
  - bedrock/agentcore-runtime-mcp-example
  - bedrock/agentcore-runtime-mcp-example/mcp-server
  - bedrock/bedrock-mantle-example
  - codebuild/codebuild-gha-lambda-runner-example
  - codebuild/custom-image-test
  - codeconections
  - ec2-bluegreen/cloudfront
  - ec2-bluegreen/ec2
  - infra/acm
  - infra/ecs
  - infra/s3
  - infra/vpc
  - lambda/apollo-server-url
  - lambda/eventbridge-lambda
  - lambda/layer/functions/function
  - lambda/layer/functions/function/handler
  - lambda/layer/layer
  - lambda/layer/layer/src/nodejs
  - lambda/rust-runtime
  - node-sign-v4-example

allowBuilds:
  '@apollo/protobufjs': false
  better-sqlite3: false
  esbuild: false
  node-llama-cpp: false
  protobufjs: false
  sharp: false
  tldjs: false
  tree-sitter-go: true
  tree-sitter-javascript: true
  tree-sitter-python: true
  tree-sitter-rust: true
  tree-sitter-typescript: true
  unrs-resolver: true

enablePrePostScripts: false

engineStrict: true

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.4.1
  - protobufjs@8.5.1
  - '@oxfmt/binding-android-arm-eabi@0.67.0'
  - '@oxfmt/binding-android-arm64@0.67.0'
  - '@oxfmt/binding-darwin-arm64@0.67.0'
  - '@oxfmt/binding-darwin-x64@0.67.0'
  - '@oxfmt/binding-freebsd-x64@0.67.0'
