packages:
  - bedrock/agentcore-runtime-agent-example
  - bedrock/agentcore-runtime-agent-example/app
  - bedrock/agentcore-runtime-mcp-example
  - bedrock/agentcore-runtime-mcp-example/mcp-server
  - bedrock/bedrock-mantle-example
  - codebuild/codebuild-gha-lambda-runner-example
  - codebuild/custom-image-test
  - codeconections
  - ec2-bluegreen/cloudfront
  - ec2-bluegreen/ec2
  - infra/acm
  - infra/ecs
  - infra/s3
  - infra/vpc
  - lambda/apollo-server-url
  - lambda/eventbridge-lambda
  - lambda/layer/functions/function
  - lambda/layer/functions/function/handler
  - lambda/layer/layer
  - lambda/layer/layer/src/nodejs
  - lambda/rust-runtime
  - node-sign-v4-example

allowBuilds:
  '@apollo/protobufjs': false
  better-sqlite3: false
  esbuild: false
  node-llama-cpp: false
  protobufjs: false
  sharp: false
  tldjs: false
  tree-sitter-go: true
  tree-sitter-javascript: true
  tree-sitter-python: true
  tree-sitter-rust: true
  tree-sitter-typescript: true
  unrs-resolver: true

enablePrePostScripts: false

engineStrict: true

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.12.1

overrides:
  semver: '>=7'
  uuid: '>=14.0.0'

  typescript: ^7.0.2
  '@opentelemetry/instrumentation-cassandra-driver@<0.66.0': ^0.66.0
  '@opentelemetry/instrumentation-knex@<0.65.0': ^0.65.0
  '@opentelemetry/instrumentation-mongoose@<0.67.0': ^0.67.0
  '@opentelemetry/instrumentation-mysql2@<0.67.0': ^0.67.0
  '@opentelemetry/instrumentation-mysql@<0.67.0': ^0.67.0
  '@opentelemetry/instrumentation-oracledb@<0.46.0': ^0.46.0
  '@opentelemetry/instrumentation-pg@<0.73.0': ^0.73.0
  '@opentelemetry/instrumentation-tedious@<0.40.0': ^0.40.0
  '@opentelemetry/propagator-jaeger@<2.9.0': ^2.9.0

strictPeerDependencies: false

trustPolicy: no-downgrade
